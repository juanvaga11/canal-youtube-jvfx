name: Generar voz de los guiones
on:
  push:
    paths: ["guiones/**", "herramientas/**", ".github/workflows/voz.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: voz, cancel-in-progress: false }
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts
      - run: python herramientas/voz.py
      - name: Guardar
        run: |
          git config user.name "jvfx-bot"; git config user.email "bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Voz generada [skip ci]" && git pull --rebase && git push)
