name: Generar voces de prueba
on:
  push:
    paths: ["pruebas_voz/texto.txt", ".github/workflows/voces.yml", "herramientas/pronunciacion.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts
      - name: Generar
        run: |
          mkdir -p pruebas_voz/salida
          python herramientas/pronunciacion.py pruebas_voz/texto.txt > /tmp/t.txt
          cat /tmp/t.txt
          edge-tts --voice es-MX-JorgeNeural --rate=+5% -f /tmp/t.txt --write-media pruebas_voz/salida/jorge_corregido.mp3
      - name: Guardar
        run: |
          git config user.name "jvfx-bot"; git config user.email "bot@users.noreply.github.com"
          git add pruebas_voz/salida && git commit -m "Voz corregida [skip ci]" && git push
